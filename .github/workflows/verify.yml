name: Build and preserve URLs
on:
  push:
    branches-ignore:
      - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Source & types
        id: foundation
        run: npm run verify -- --group foundation
      - name: Build site
        id: build
        run: npm run verify -- --group build
      - name: Routes & contact
        id: routes_contact
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group routes-contact
      - name: Services & locations
        id: services
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group services
      - name: Products & comparisons
        id: products
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group products
      - name: Photography & galleries
        id: photography
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group photography
      - name: Blog & navigation
        id: blog
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group blog
      - name: Schema & sitemap
        id: seo
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group seo
      - name: Retain per-check verification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verification-log
          path: ${{ runner.temp }}/verification/
          if-no-files-found: ignore
          retention-days: 14
