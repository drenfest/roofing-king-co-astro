name: Deploy Cloudways review
on:
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: cloudways-review
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudways-review
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Source & types
        id: foundation
        run: npm run verify -- --group foundation
      - name: Build site
        id: build
        run: npm run verify -- --group build
      - name: Routes & contact
        id: routes_contact
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group routes-contact
      - name: Services & locations
        id: services
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group services
      - name: Products & comparisons
        id: products
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group products
      - name: Photography & galleries
        id: photography
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group photography
      - name: Blog & navigation
        id: blog
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group blog
      - name: Schema & sitemap
        id: seo
        if: ${{ !cancelled() && steps.foundation.outcome == 'success' && steps.build.outcome == 'success' }}
        run: npm run verify -- --group seo
      - name: Retain per-check verification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verification-log
          path: ${{ runner.temp }}/verification/
          if-no-files-found: ignore
          retention-days: 14
      - name: Record the deployed commit
        run: node -e "require('node:fs').writeFileSync('dist/release.json', JSON.stringify({commit:process.env.GITHUB_SHA}) + '\n')"
      - name: Package static output
        run: tar -czf "$RUNNER_TEMP/site.tar.gz" -C dist .
      - name: Deploy verified output over pinned SSH
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.CLOUDWAYS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.CLOUDWAYS_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.CLOUDWAYS_HOST }}
          DEPLOY_USER: ${{ vars.CLOUDWAYS_USER }}
          APP_ROOT: ${{ vars.CLOUDWAYS_APP_ROOT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$APP_ROOT" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/cloudways_review
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh_opts=(-i ~/.ssh/cloudways_review -o BatchMode=yes -o StrictHostKeyChecking=yes)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "${ssh_opts[@]}" "$target" "mkdir -p '$APP_ROOT/private_html/astro-deploy/incoming'"
          scp "${ssh_opts[@]}" "$RUNNER_TEMP/site.tar.gz" "$target:private_html/astro-deploy/incoming/$GITHUB_SHA.tar.gz"
          scp "${ssh_opts[@]}" scripts/deploy-cloudways.sh "$target:private_html/astro-deploy/deploy-$GITHUB_SHA.sh"
          ssh "${ssh_opts[@]}" "$target" "bash '$APP_ROOT/private_html/astro-deploy/deploy-$GITHUB_SHA.sh' '$APP_ROOT' '$GITHUB_SHA'"
      - name: Check review site after deployment
        run: node scripts/check-cloudways-review.mjs
